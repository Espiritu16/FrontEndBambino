<section class="carta-shell">
  @if (loading) {
    <p>Cargando carta PDF...</p>
  } @else if (error) {
    <p>{{ error }}</p>
    <div class="actions">
      <button type="button" (click)="retry()">Reintentar</button>
      <a routerLink="/inicio">Volver a inicio</a>
    </div>
  } @else {
    <div class="viewer-wrap">
      <iframe [src]="viewerUrl" title="Carta PDF" loading="lazy"></iframe>
    </div>
    <div class="actions">
      <a [href]="pdfUrl" target="_blank" rel="noopener noreferrer">Abrir URL directa</a>
      <a routerLink="/inicio">Volver a inicio</a>
    </div>
  }
</section>
