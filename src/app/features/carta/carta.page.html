<div class="menu-page">
  <header class="menu-topbar">
    <button class="icon-btn" type="button" aria-label="Abrir menu">☰</button>
    <a class="menu-brand" routerLink="/inicio">
      <img src="/logo-bambino-sinfondo.png" alt="Bambino" />
      <span>Bambino</span>
    </a>
    <div class="menu-topbar__right">
      <button class="icon-btn" type="button" aria-label="Notificaciones">👜</button>
      <button class="avatar" type="button" aria-label="Perfil"></button>
    </div>
  </header>

  <section class="menu-hero">
    <h1>Nuestra Carta</h1>
    <p>Explora nuestras categorías y elige tu favorito</p>
  </section>

  <section class="menu-filters">
    <div class="chips">
      @for (category of categories; track category) {
        <button class="chip" [class.chip--active]="category === 'Todo'" type="button">{{ category }}</button>
      }
    </div>
    <div class="search-row">
      <label class="menu-search">
        <span>🔍</span>
        <input type="text" placeholder="Buscar plato..." />
      </label>
      <button class="menu-location" type="button">📍 Sede</button>
    </div>
  </section>

  <section class="menu-list">
    <h2>Pollo a la Brasa</h2>
    <div class="menu-cards">
      @for (dish of dishes; track dish.name) {
        <article class="menu-card card">
          <div class="menu-card__media" [class.menu-card__media--mint]="dish.tone === 'mint'">
            @if (dish.badge) {
              <span class="menu-card__badge">{{ dish.badge }}</span>
            }
            <div class="dish-photo"></div>
          </div>
          <div class="menu-card__body">
            <h3>{{ dish.name }}</h3>
            <p>{{ dish.description }}</p>
            <strong>{{ dish.price }}</strong>
            <button class="btn menu-card__btn" type="button">+ Agregar</button>
          </div>
        </article>
      }
    </div>
  </section>
</div>
