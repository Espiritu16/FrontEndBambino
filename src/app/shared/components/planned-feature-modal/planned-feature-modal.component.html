<div class="planned-modal-backdrop" (click)="close.emit()">
  <section class="planned-modal" role="dialog" aria-modal="true" aria-label="Módulo en desarrollo" (click)="$event.stopPropagation()">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <button class="planned-modal__btn" type="button" (click)="close.emit()">{{ buttonText }}</button>
  </section>
</div>
