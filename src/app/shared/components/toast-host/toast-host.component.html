<div class="toast-host" aria-live="polite" aria-atomic="false">
  @for (toast of (toastService.toasts$ | async); track toast.id) {
    <article class="toast" [class]="'toast toast--' + toast.type" role="status">
      <span class="material-symbols-outlined toast__icon">{{ iconMap[toast.type] }}</span>
      <p class="toast__text">{{ toast.message }}</p>
      <button class="toast__close" type="button" aria-label="Cerrar" (click)="closeToast(toast.id)">
        <span class="material-symbols-outlined">close</span>
      </button>
    </article>
  }
</div>
