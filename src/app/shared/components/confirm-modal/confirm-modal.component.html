<div class="logout-confirm-backdrop">
  <section class="logout-confirm-modal" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" aria-label="Confirmación">
    <h3>{{ title }}</h3>
    <p>{{ message }}</p>
    <div class="logout-confirm-actions">
      <button type="button" class="topbar-btn topbar-btn--ghost" (click)="cancel.emit()">{{ cancelText }}</button>
      <button type="button" class="topbar-btn topbar-btn--solid" (click)="confirm.emit()">{{ confirmText }}</button>
    </div>
  </section>
</div>
